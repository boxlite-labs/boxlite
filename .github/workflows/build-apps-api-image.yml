name: Build apps/api image

# Builds the apps/api image, for apps/api only. Three operations:
#
#   commit  — called by deploy-infra.yml for the commit being deployed, tagged v<version>-<ref>
#   build   — dispatched for a release, tagged <version>, into dev
#   promote — copies a released tag from one stage's repository to another, in either the same
#             region or another one (source_region)
#
# Named per service because it is one of three the stack builds from source — apps/proxy and
# apps/otel-collector are the others (sst.config.ts) and have no published-image path yet, so a
# release deploy still compiles them from the deployed checkout. A sibling workflow per service
# is the intended shape.
#
# A released image is built once into the dev repository, then promoted: promotion copies that
# exact manifest registry-side, addressed by digest, and verifies the digest survived — it never
# rebuilds and never round-trips the image through a local daemon. A commit build has nothing to
# promote; it writes straight into the stage being deployed. The per-stage repositories are
# provisioned by apps/infra/bootstrap/aws.ts's ensureApiImageRepository so a fresh stack can consume
# an image without first having to create its own input.
#
# `build` is dispatched from main rather than triggered by the release event. A release event
# runs on a tag ref, and the deployment Environments that hold the AWS role are branch-scoped, so
# a tag-triggered job is blocked before it can obtain credentials. Dispatching from main also
# keeps the same main-only rule the two deploy workflows enforce.

on:
  # How deploy-infra.yml builds the Api for the commit it is deploying, as a job beside build-c
  # rather than as work buried inside `sst deploy`. Same repository, same immutable-tag rules; the
  # tag carries the ref, so a commit build can never collide with what a release promotes.
  workflow_call:
    inputs:
      stage:
        description: 'Stage whose repository receives the image.'
        required: true
        type: string
      ref:
        description: 'Full SHA to build. Selects commit mode; tags the image v<version>-<ref>.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: 'build the released image into dev, or promote it to another stage.'
        required: true
        default: build
        type: choice
        options: [build, promote]
      # Allowlists for the same reason deploy-release.yml uses one: these select the protected
      # Environment that holds the AWS role.
      stage:
        description: 'Target stage. Must be dev when building.'
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      source_stage:
        description: 'Stage that already contains this exact image (promote only).'
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod
      source_region:
        description: 'Region holding source_stage, when it differs from the target (promote only).'
        required: false
        default: ''
        type: string
      version:
        description: 'Stable X.Y.Z, matching the release tag being published.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-apps-api-image-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build apps/api image
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.stage || 'dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      # Where the image being promoted already lives, which `vars` cannot answer: a job binds to
      # one Environment and that one is the target's, so `vars.AWS_REGION` is always the region
      # receiving the image. Stages are not required to share a region — dev is ap-southeast-1
      # while prod is us-west-2 — and a registry is one account in one region, so a promote that
      # assumes they match looks for the source repository in the target's region and reports the
      # repository as missing rather than as elsewhere. Empty means "the same region as the
      # target", which is every same-region promote and what this workflow assumed before.
      SOURCE_REGION: ${{ inputs.source_region || vars.AWS_REGION || 'ap-southeast-1' }}
      # `ref` is the workflow_call-only input, so its presence is what selects commit mode.
      OPERATION: ${{ inputs.ref && 'commit' || inputs.operation }}
      TARGET_STAGE: ${{ inputs.stage || 'dev' }}
      SOURCE_STAGE: ${{ inputs.source_stage || 'dev' }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_REF: ${{ inputs.ref }}

    steps:
      # The release tag, not main's tip: a build must contain exactly the released source.
      - name: Checkout the released tag
        if: inputs.operation == 'build'
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      # The caller resolved this and proved it is a commit on main, or the head of an open pull
      # request in this repository (deploy-infra.yml resolve-ref); the operation guard below
      # re-checks its shape rather than trusting the input's provenance.
      - name: Checkout the selected commit
        if: inputs.ref != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify native AMD64 Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(docker info --format '{{.Architecture}}')" = "x86_64"

      - name: Resolve publish operation
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_STAGE" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]] || { echo "invalid target stage '$TARGET_STAGE'" >&2; exit 1; }
          [[ "$SOURCE_STAGE" =~ ^[a-z0-9][a-z0-9-]{0,31}$ ]] || { echo "invalid source stage '$SOURCE_STAGE'" >&2; exit 1; }

          operation="$OPERATION"
          case "$operation" in
            build | promote | commit) ;;
            *) echo "invalid operation '$operation'" >&2; exit 1 ;;
          esac

          if [ "$operation" = commit ]; then
            # A commit build carries the version its own source declares — there is no input to
            # disagree with, and the tag has to name the Cargo version that commit compiled for
            # the same reason the Runner's tarball name does.
            [[ "$INPUT_REF" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ref must be a full lowercase commit sha (got '$INPUT_REF')" >&2
              exit 1
            }
            version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          else
            version="$INPUT_VERSION"
          fi

          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "version must be a stable X.Y.Z (got '$version')" >&2
            exit 1
          }
          if [ "$operation" = build ]; then
            # The checked-out tag must actually declare this version, otherwise the immutable
            # tag would name bytes built from different source.
            cargo_version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
            [ "$cargo_version" = "$version" ] || {
              echo "tag v$version declares Cargo.toml version $cargo_version" >&2
              exit 1
            }
            [ "$TARGET_STAGE" = dev ] || {
              echo "builds always land in dev; use operation=promote to reach $TARGET_STAGE" >&2
              exit 1
            }
          fi
          if [ "$operation" = promote ] && [ "$SOURCE_STAGE" = "$TARGET_STAGE" ]; then
            echo "source_stage and stage must differ for a promotion" >&2
            exit 1
          fi

          # The one identity everything downstream addresses. Must equal apiImageTag() in
          # apps/infra/artifacts/api.ts, which is what the deploy resolves to.
          if [ "$operation" = commit ]; then
            tag="v${version}-${INPUT_REF}"
          else
            tag="$version"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "operation=$operation"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/boxlite-${{ inputs.stage || 'dev' }}-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: build-apps-api-image-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          target_registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          source_registry="${account}.dkr.ecr.${SOURCE_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$target_registry"
          # A second login when the source stage is in another region. The role already reaches it
          # — deploy-role-policy.json grants ecr:* on Resource '*', which no region scopes — but a
          # docker credential is per registry host, and the copy below reads the source through
          # docker rather than through the AWS CLI.
          if [ "$source_registry" != "$target_registry" ]; then
            aws ecr get-login-password --region "$SOURCE_REGION" | docker login --username AWS --password-stdin "$source_registry"
          fi
          echo "target=${target_registry}/boxlite-app-${TARGET_STAGE}-api" >> "$GITHUB_OUTPUT"
          echo "source=${source_registry}/boxlite-app-${SOURCE_STAGE}-api" >> "$GITHUB_OUTPUT"

      - name: Verify bootstrap repositories and target tag
        id: target
        shell: bash
        env:
          TAG: ${{ steps.artifact.outputs.tag }}
          OPERATION: ${{ steps.artifact.outputs.operation }}
        run: |
          set -euo pipefail
          target_name="boxlite-app-${TARGET_STAGE}-api"
          aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$target_name" >/dev/null || {
            echo "ECR repository $target_name is missing; run npm run bootstrap -- --stage $TARGET_STAGE first" >&2
            exit 1
          }
          source_digest=""
          if [ "$OPERATION" = promote ]; then
            source_name="boxlite-app-${SOURCE_STAGE}-api"
            # SOURCE_REGION, not AWS_REGION: the source stage need not share the target's region,
            # and reading it in the wrong one returns RepositoryNotFoundException — which reads as
            # "never published" when the image is published, just elsewhere. Both messages below
            # name the region for that reason.
            source_digest=$(aws ecr describe-images --region "$SOURCE_REGION" --repository-name "$source_name" \
              --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text) || {
                echo "$source_name:$TAG was not found in $SOURCE_REGION; pass source_region if that stage is in another region" >&2
                exit 1
              }
            # `--query` on a missing tag in an existing repository prints the literal None and
            # exits zero, so the guard above cannot see it. Left unchecked it reaches the copy as
            # "$SOURCE@None" — the same hole artifacts/api.ts:104 closes on the deploy side.
            if [ -z "$source_digest" ] || [ "$source_digest" = None ]; then
              echo "$source_name:$TAG has not been published in $SOURCE_REGION" >&2
              exit 1
            fi
          fi
          target_digest=$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$target_name" \
            --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$target_digest" ] && [ "$target_digest" != None ]; then
            if [ "$OPERATION" = promote ] && [ "$target_digest" != "$source_digest" ]; then
              echo "$target_name:$TAG exists with digest $target_digest, not source digest $source_digest" >&2
              exit 1
            fi
            # Re-running a build deploy for a commit already published is the normal case, not an
            # error: the tag is immutable, so the bytes under it are the ones this deploy wants.
            echo "$target_name:$TAG is already published; leaving it untouched"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "target_repository=$target_name" >> "$GITHUB_OUTPUT"

      - name: Build the image once
        if: steps.target.outputs.needed == 'true' && steps.artifact.outputs.operation != 'promote'
        shell: bash
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          TAG: ${{ steps.artifact.outputs.tag }}
          TARGET: ${{ steps.ecr.outputs.target }}
        run: |
          set -euo pipefail
          docker build --file apps/api/Dockerfile --build-arg "VERSION=$VERSION" --tag "$TARGET:$TAG" .
          docker push "$TARGET:$TAG"

      - name: Promote the exact published image
        if: steps.target.outputs.needed == 'true' && steps.artifact.outputs.operation == 'promote'
        shell: bash
        env:
          TAG: ${{ steps.artifact.outputs.tag }}
          SOURCE: ${{ steps.ecr.outputs.source }}
          TARGET: ${{ steps.ecr.outputs.target }}
          TARGET_REPOSITORY: ${{ steps.target.outputs.target_repository }}
          SOURCE_DIGEST: ${{ steps.target.outputs.source_digest }}
        run: |
          set -euo pipefail
          # Registry-side manifest copy. pull + tag + push round-trips the image through the local
          # daemon and re-uploads it, which can land a different digest — the one thing this step
          # promises not to do, and what the deploy then resolves by tag.
          #
          # --prefer-index=false is required, not cosmetic: it defaults to true, and with a single
          # non-index source — which the build step's plain "docker build" then "docker push"
          # produces — the default wraps that manifest in a newly minted index carrying a new
          # digest instead of copying it. That would fail the check below only after the wrong
          # digest was already published under the target tag, where the guard in the previous
          # step then refuses every retry.
          #
          # The source is addressed by digest for the same reason the copy must not re-serialize:
          # the tag could move between the check above and this copy.
          docker buildx imagetools create --prefer-index=false \
            --tag "$TARGET:$TAG" "$SOURCE@$SOURCE_DIGEST"
          promoted=$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$TARGET_REPOSITORY" \
            --image-ids "imageTag=$TAG" --query 'imageDetails[0].imageDigest' --output text)
          if [ "$promoted" != "$SOURCE_DIGEST" ]; then
            echo "promotion changed the digest ($SOURCE_DIGEST -> $promoted); the image is not the published one" >&2
            exit 1
          fi
          echo "promoted $SOURCE_DIGEST unchanged"
